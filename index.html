<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mission Green</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b6b45">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f1e8;--card:#fff;--ink:#0f2a22;--mut:#5c6b63;--g:#1b6b45;--gl:#dcefe3;--a:#f2b84b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2a22;--card:#173a2f;--ink:#f3f1e8;--mut:#9bb5a8;--g:#4caf6d;--gl:#22503f}}
:root[data-theme="dark"]{--bg:#0f2a22;--card:#173a2f;--ink:#f3f1e8;--mut:#9bb5a8;--g:#4caf6d;--gl:#22503f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;margin:8px 0 2px}h2{font-size:18px;margin:20px 0 8px}p{margin:4px 0}
.mut{color:var(--mut);font-size:14px}.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0002}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:30px;font-weight:700;color:var(--g)}button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--g);color:#fff;cursor:pointer}
button.ghost{background:var(--gl);color:var(--ink)}button.chk{width:44px;height:44px;border-radius:50%;background:var(--gl);color:var(--ink);font-size:20px;flex:none}button.chk.on{background:var(--g);color:#fff}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--card);color:var(--ink);max-width:100%}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bars i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:4px;margin-bottom:4px}
.bar{height:10px;background:var(--gl);border-radius:6px;overflow:hidden;margin-top:8px}.bar b{display:block;height:100%;background:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 4px #0003}
nav button{flex:1;max-width:80px;background:none;color:var(--mut);padding:6px 2px;font-size:12px}nav button.on{color:var(--g);font-weight:700}nav span{display:block;font-size:22px}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--gl)}.badge.off{opacity:.4;filter:grayscale(1)}.badge span{font-size:34px;display:block}
.tag{font-size:12px;background:var(--a);color:#0f2a22;border-radius:8px;padding:2px 8px}
button.ghost.sel{background:var(--g);color:#fff}
</style></head><body><main id="v"></main>
<nav id="n"></nav>
<script>
var FB_URL='https://www.facebook.com/share/g/18mQPGjKbD/';
var ENDPOINT='https://script.google.com/macros/s/AKfycbyOzflmTFIsNgLjo9l3Grvn683ZwfqHXDwlCfDuJPKD4kBxYEk-8lyIzcDvpm2Cr_yV4w/exec';
var K='mission-green-v1',tab='home',S=load(),flushing=false,rate=0,ease=0,recm='';
S.q=S.q||[];S.auth=S.auth||null;S.cdone=S.cdone||{};S.nick=S.nick||'';S.fam=S.fam||'';S.consent=S.consent||false;S.uid=S.uid||('u'+Math.random().toString(36).slice(2,10));
var HAB=[
{id:'bottle',n:'Use a reusable bottle',i:'🥤',co2:.083,w:0,e:0,x:.023,m:.5},
{id:'recycle',n:'Recycle waste',i:'♻️',co2:.78,w:0,e:0,x:.25,m:0},
{id:'lights',n:'Turn off lights',i:'💡',co2:.079,w:0,e:.2,x:0,m:.037},
{id:'shower',n:'Take a short shower',i:'🚿',co2:.22,w:16,e:.56,x:0,m:.18},
{id:'walk',n:'Walk or bike instead of car',i:'🚲',co2:.393,w:0,e:0,x:0,m:.76},
{id:'plant',n:'Eat a plant-based meal',i:'🥗',co2:.6,w:0,e:0,x:0,m:0}];
var CH=[
{id:'d3',t:'Daily',n:'Do 3 habits today',tg:3,f:function(){return cnt(td())}},
{id:'w15',t:'Weekly',n:'Log 15 actions this week',tg:15,f:function(){return wk()}},
{id:'m60',t:'Monthly',n:'Log 60 actions this month',tg:60,f:function(){return mo()}},
{id:'g20',t:'Group',n:'Team challenge: recycle 20 times',tg:20,f:function(){return byHab('recycle')}}];
var BD=[
{n:'First step',i:'🌱',d:'Log 1 action',ok:function(){return tot()>=1}},
{n:'3-day streak',i:'🔥',d:'3 days in a row',ok:function(){return best()>=3}},
{n:'7-day streak',i:'⚡',d:'7 days in a row',ok:function(){return best()>=7}},
{n:'Eco 25',i:'🌳',d:'25 actions',ok:function(){return tot()>=25}},
{n:'Water saver',i:'💧',d:'Save 100 L',ok:function(){return imp().w>=100}},
{n:'Level 3',i:'🏆',d:'Reach level 3',ok:function(){return lvl()>=3}}];
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return{logs:{},goal:20,rem:{on:false,time:'20:00'},joined:[],custom:[],last:''}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function fmt(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function ad(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function td(){return fmt(new Date())}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function all(){return HAB.concat(S.custom)}
function cnt(k){return (S.logs[k]||[]).length}
function tot(){var t=0;for(var k in S.logs)t+=S.logs[k].length;return t}
function wk(){var t=0,d=new Date();for(var i=0;i<7;i++)t+=cnt(fmt(ad(d,-i)));return t}
function mo(){var p=td().slice(0,7),t=0;for(var k in S.logs)if(k.indexOf(p)==0)t+=S.logs[k].length;return t}
function byHab(id){var t=0;for(var k in S.logs)S.logs[k].forEach(function(h){if(h==id)t++});return t}
function streak(){var d=new Date();if(!cnt(fmt(d)))d=ad(d,-1);var n=0;while(cnt(fmt(d))){n++;d=ad(d,-1)}return n}
function best(){var ks=Object.keys(S.logs).filter(function(k){return cnt(k)}).sort(),b=0,c=0,p=null;ks.forEach(function(k){var d=new Date(k+'T00:00:00');c=(p&&fmt(ad(p,1))==k)?c+1:1;p=d;if(c>b)b=c});return b}
function lvl(){return Math.floor(tot()*10/100)+1}
function imp(){var r={co2:0,w:0,e:0,x:0,m:0},A=all();for(var k in S.logs)S.logs[k].forEach(function(id){var h=A.filter(function(a){return a.id==id})[0];if(h){r.co2+=h.co2||0;r.w+=h.w||0;r.e+=h.e||0;r.x+=h.x||0;r.m+=h.m||0}});r.trees=r.co2/60;return r}
function f1(n){return Math.round(n*10)/10}
function chg(id,d){var k=td(),a=S.logs[k]||[];if(d>0)a.push(id);else{var i=a.lastIndexOf(id);if(i<0)return;a.splice(i,1)}S.logs[k]=a;if(!a.length)delete S.logs[k];ev({type:'habit',habit:id,action:d>0?'done':'undo'});chkCh();save();show()}
function ring(p){var c=251.3;return '<svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--gl)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">'+Math.round(p*100)+'%</text></svg>'}
function bars(){var h='<div class="bars">',d=new Date(),dn=['Su','Mo','Tu','We','Th','Fr','Sa'];for(var i=6;i>=0;i--){var x=ad(d,-i),c=cnt(fmt(x));h+='<div><i style="height:'+Math.min(c,5)*14+'px"></i>'+dn[x.getDay()]+'</div>'}return h+'</div>'}
function home(){var p=Math.min(1,wk()/S.goal),t=cnt(td()),s=streak();
return '<h1>Hello! 🌿</h1><p class="mut">Small actions, big impact.</p>'+
'<div class="card row sp"><div><b>'+(t?'Keep going!':'Start today!')+'</b><p class="mut">'+t+' action'+(t==1?'':'s')+' logged today</p></div><div style="text-align:center"><div class="big">🔥 '+s+'</div><div class="mut">Day streak</div></div></div>'+
'<h2>Streak chart</h2><div class="card">'+bars()+'<p class="mut">Actions per day, last 7 days</p></div>'+
'<h2>Your progress</h2><div class="card row">'+ring(p)+'<div><b>'+wk()+' of '+S.goal+' actions this week</b><p class="mut">Weekly goal. Change it in Habits.</p></div></div>'+
'<h2>Reminders</h2><div class="card"><div class="row sp"><b>Daily push reminder</b><button class="'+(S.rem.on?'':'ghost')+'" data-a="rem">'+(S.rem.on?'On':'Off')+'</button></div><div class="row" style="margin-top:8px"><input type="time" id="rt" value="'+S.rem.time+'"><span class="mut">Choose reusable over single-use. Small choices, big change!</span></div><p class="mut">Notifications show while the app is open in this demo.</p></div>'+
'<div class="row" style="margin-top:16px"><button class="ghost" data-a="demo">Load demo data</button><button class="ghost" data-a="clear">Clear all data</button></div>'}
function habits(){var h='<h1>Habit tracker</h1><p class="mut">Tap + each time you do a habit. Tap − to undo one.</p>',A=all(),l=S.logs[td()]||[];
A.forEach(function(a){var n=l.filter(function(x){return x==a.id}).length;h+='<div class="card row"><span style="font-size:30px">'+(a.i||'🌿')+'</span><div style="flex:1;min-width:0"><b>'+esc(a.n)+'</b><p class="mut">Today: '+n+' · All time: '+byHab(a.id)+'</p></div><button class="chk" data-a="dec" data-id="'+a.id+'" aria-label="Remove one">−</button><button class="chk on" data-a="tg" data-id="'+a.id+'" aria-label="Add one">+</button></div>'});
return h+'<h2>Set a weekly goal</h2><div class="card row"><select id="gs">'+[10,15,20,25,30].map(function(g){return '<option'+(g==S.goal?' selected':'')+'>'+g+'</option>'}).join('')+'</select><span>actions per week</span></div><h2>Add your own habit</h2><div class="card row"><input id="nh" placeholder="e.g. Compost food scraps" style="flex:1"><button data-a="add">Add</button></div>'}
function chal(){var h='<h1>Challenges</h1><p class="mut">Daily, weekly, monthly and group.</p>';
CH.forEach(function(c){var j=S.joined.indexOf(c.id)>=0,v=Math.min(c.tg,c.f());h+='<div class="card"><div class="row sp"><span class="tag">'+c.t+'</span><button class="'+(j?'ghost':'')+'" data-a="join" data-id="'+c.id+'">'+(j?'Joined':'Join')+'</button></div><p><b>'+c.n+'</b></p>'+(j?'<div class="bar"><b style="width:'+(v/c.tg*100)+'%"></b></div><p class="mut">'+v+' / '+c.tg+(v>=c.tg?' Complete! 🎉':'')+'</p>':'')+'</div>'});
return h+'<p class="mut">Group totals are for this device in the prototype. Sharing across phones is our next step.</p>'}
function rew(){var pts=tot()*10,h='<h1>Rewards</h1><div class="card row sp"><div><b>Level '+lvl()+'</b><p class="mut">'+pts+' points. 10 points per action.</p></div><span style="font-size:40px">🏆</span></div><div class="bar"><b style="width:'+(pts%100)+'%"></b></div><h2>Badges</h2><div class="grid">';
BD.forEach(function(b){h+='<div class="badge '+(b.ok()?'':'off')+'"><span>'+b.i+'</span><b>'+b.n+'</b><p class="mut">'+b.d+'</p></div>'});return h+'</div>'}
function m$(n){return '$'+n.toFixed(2)}
function ic(a,b){return '<div class="card"><div class="big">'+a+'</div><p class="mut">'+b+'</p></div>'}
function impact(){var r=imp(),A=all(),rows=A.filter(function(a){return byHab(a.id)}).map(function(a){var n=byHab(a.id);return '<div class="row sp"><span>'+(a.i||'🌿')+' '+esc(a.n)+'</span><b>'+n+'x · '+f1(n*(a.co2||0))+' kg · '+m$(n*(a.m||0))+'</b></div>'}).join('')||'<p class="mut">Log a habit to see your savings.</p>';
return '<h1>Impact dashboard</h1><p class="mut">Your estimated savings by action.</p><div class="grid">'+ic('💰 '+m$(r.m),'Money saved')+ic('🌍 '+f1(r.co2)+' kg','CO₂ avoided')+ic('🌳 '+r.trees.toFixed(2),'Trees (1-year equivalent)')+ic('💧 '+Math.round(r.w)+' L','Water saved')+ic('⚡ '+f1(r.e)+' kWh','Energy saved')+ic('🗑️ '+f1(r.x)+' kg','Waste avoided')+'</div><h2>By habit</h2><div class="card">'+rows+'</div><details class="card"><summary><b>How we calculate this</b></summary>'+'<p class="mut">Prices and carbon factors are estimates. Each tap adds the amounts below.</p><p class="mut">Electricity: $0.1844 per kWh (DTE Energy residential Time of Day off-peak base rate, 2026; surcharges not included) and 0.394 kg CO₂ per kWh (EPA, US average).</p><p class="mut">Driving: 0.393 kg CO₂ per mile (EPA) and $0.76 per mile (IRS standard mileage rate from July 2026, which includes ownership costs). One tap = 1 mile not driven.</p><p class="mut">Water: about $0.0047 per liter, from the 2025 US average water and sewer bill of $86 for 4,800 gallons (Manny Teodoro).</p><p class="mut">Short shower: assumed 2 minutes shorter at 2.1 gallons a minute (about 16 L) and 0.56 kWh less water heating (assumed 55°F warmer water).</p><p class="mut">Lights: one tap = about 0.2 kWh (for example 100 W of lighting off for 2 hours).</p><p class="mut">Reusable bottle: replaces one 500 ml plastic bottle, about 0.083 kg CO₂ and 23 g of plastic, valued at $0.50 (assumed).</p><p class="mut">Recycling: one tap = about 0.25 kg of mixed recyclables, avoiding about 3.1 kg CO₂e per kg (EPA WARM: 2.83 metric tons CO₂e per ton).</p><p class="mut">Plant-based meal: about 0.6 kg CO₂e less, from a UK study (Scarborough et al., 2014): 5.63 vs 3.81 kg a day, divided by 3 meals. Money not estimated.</p><p class="mut">Trees: one urban tree absorbs about 60 kg CO₂ a year (EPA).</p><p class="mut">Custom habits count for points and streaks but have no savings estimate.</p></details>'}
function post(o,cb){try{fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})}catch(x){cb(null)}}
function ev(o){if(!S.auth)return;o.nick=S.auth.nick;o.fam=S.fam;o.date=td();o.ts=new Date().toISOString();S.q.push(o);save();flush()}
function flush(){if(ENDPOINT.indexOf('http')!=0||!S.auth||!S.q.length||flushing)return;flushing=true;var b=S.q.slice();post({a:'events',uid:S.auth.uid,token:S.auth.token,events:b},function(r){flushing=false;if(r&&r.ok){S.q=S.q.slice(b.length);save();if(tab=='me')show()}else if(r&&r.auth){S.auth=null;save();if(tab=='me')show()}})}
function ckey(id,d){if(id=='d3')return d;if(id=='w15')return ''+Math.floor(Date.parse(d+'T00:00:00Z')/864e5/7);if(id=='m60')return d.slice(0,7);return 'all'}
function chkCh(){CH.forEach(function(c){if(S.joined.indexOf(c.id)<0)return;if(c.f()>=c.tg){var k=c.id+'|'+ckey(c.id,td());if(!S.cdone[k]){S.cdone[k]=1;ev({type:'challenge',habit:c.id,action:'complete'})}}})}
var lastPull=0;
function pull(manual){if(ENDPOINT.indexOf('http')!=0||!S.auth||flushing)return;if(!manual&&Date.now()-lastPull<30000)return;lastPull=Date.now();
post({a:'history',uid:S.auth.uid,token:S.auth.token},function(r){if(!r||!r.ok){if(r&&r.auth){S.auth=null;save();show()}else if(manual)say('sm','Could not sync. Try again.');return}
if(S.auth)S.auth.admin=!!r.admin;var m={},cu={},st={};r.rows.forEach(function(x){if(x[3]=='challenge'){if(x[2]=='complete')S.cdone[x[1]+'|'+ckey(x[1],x[0])]=1;else st[x[1]]=(x[2]=='join')}else if(x[3]=='habit'){var k=x[0]+'|'+x[1];m[k]=(m[k]||0)+(x[2]=='done'?1:-1)}else if(x[3]=='custom'&&x[1])cu[x[1]]=x[4]});
S.q.forEach(function(x){if(x.type=='habit'){var k=x.date+'|'+x.habit;if(k in m)m[k]+=(x.action=='done'?1:-1)}});
for(var k in m){var p=k.split('|'),d=p[0],id=p[1],n=Math.max(0,m[k]),a=(S.logs[d]||[]).filter(function(h){return h!=id});for(var i=0;i<n;i++)a.push(id);if(a.length)S.logs[d]=a;else delete S.logs[d]}
for(var id in cu)if(!all().some(function(h){return h.id==id}))S.custom.push({id:id,n:cu[id],i:'🌿',co2:0,w:0,e:0,x:0,m:0});
for(var cid in st){var ji=S.joined.indexOf(cid);if(st[cid]&&ji<0)S.joined.push(cid);else if(!st[cid]&&ji>=0)S.joined.splice(ji,1)}
S.joined.slice().forEach(function(cid){if(!(cid in st))ev({type:'challenge',habit:cid,action:'join'})});
chkCh();save();if(manual||tab!='me')show();if(manual)say('sm','Synced.')})}
var FEAT=['Streak chart','Progress tracker','Habit tracker','Challenges','Rewards','Reminders','Impact dashboard'];
function sc(g){return [1,2,3,4,5].map(function(n){return '<button class="chk" data-a="rate" data-g="'+g+'" data-id="'+n+'">'+n+'</button>'}).join('')}
var ADM=null;
function loadAdmin(){post({a:'admin',uid:S.auth.uid,token:S.auth.token},function(r){ADM=(r&&r.ok)?r:{err:(r&&r.denied)?'You do not have admin access.':'Could not load. Please try again.'};if(tab=='admin')show()})}
function adminView(){var h='<h1>Admin</h1><div class="row"><button class="ghost" data-a="admback">Back</button><button data-a="adm">Refresh</button></div>';
if(!ADM)return h+'<p class="mut">Loading...</p>';
if(ADM.err)return h+'<p class="mut">'+esc(ADM.err)+'</p>';
var F=ADM.feedback,st=ADM.stats;
function avg(k){var t=0,c=0;F.forEach(function(x){var v=+x[k];if(v){t+=v;c++}});return c?(t/c).toFixed(1):'-'}
var rec={Yes:0,Maybe:0,No:0},fav={};F.forEach(function(x){if(rec[x.rec]!=null)rec[x.rec]++;if(x.fav)fav[x.fav]=(fav[x.fav]||0)+1});
h+='<div class="grid">'+ic(st.users,'Registered users')+ic(st.active7,'Active this week')+ic(st.taps,'Habit taps')+ic(st.feedback,'Feedback responses')+ic(avg('rating')+' / 5','Average rating')+ic(avg('ease')+' / 5','Ease of use')+'</div>';
var TT={co2:0,w:0,e:0,x:0,m:0},hb=ADM.habits||{};HAB.forEach(function(a){var n=hb[a.id]||0;TT.co2+=n*a.co2;TT.w+=n*a.w;TT.e+=n*a.e;TT.x+=n*a.x;TT.m+=n*a.m});
h+='<h2>Total community impact</h2><div class="grid">'+ic('💰 '+m$(TT.m),'Money saved')+ic('🌍 '+f1(TT.co2)+' kg','CO₂ avoided')+ic('🌳 '+(TT.co2/60).toFixed(2),'Trees (1-year equivalent)')+ic('💧 '+Math.round(TT.w)+' L','Water saved')+ic('⚡ '+f1(TT.e)+' kWh','Energy saved')+ic('🗑️ '+f1(TT.x)+' kg','Waste avoided')+'</div><div class="card"><b>Actions by habit</b>'+HAB.map(function(a){return '<div class="row sp"><span>'+a.i+' '+esc(a.n)+'</span><b>'+(hb[a.id]||0)+'</b></div>'}).join('')+'</div><p class="mut">Estimates using the factors in the Impact tab. Custom habits count as taps but have no savings estimate.</p>';
h+='<div class="card"><b>Would recommend</b><p>Yes '+rec.Yes+' · Maybe '+rec.Maybe+' · No '+rec.No+'</p><b>Favorite features</b>'+(Object.keys(fav).sort(function(a,b){return fav[b]-fav[a]}).map(function(k){return '<div class="row sp"><span>'+esc(k)+'</span><b>'+fav[k]+'</b></div>'}).join('')||'<p class="mut">No answers yet.</p>')+'</div>';
h+='<h2>Responses</h2>'+(F.map(function(x){return '<div class="card"><div class="row sp"><b>'+esc(x.nick||'(no name)')+(x.fam?' · '+esc(x.fam):'')+'</b><span class="mut">'+esc(x.date)+'</span></div><p class="mut">Rating '+esc(x.rating)+'/5 · Ease '+esc(x.ease||'-')+'/5 · Recommend: '+esc(x.rec||'-')+'</p><p>Favorite: '+esc(x.fav||'-')+'</p>'+(x.improve?'<p><b>Improve:</b> '+esc(x.improve)+'</p>':'')+(x.comment?'<p><b>Other:</b> '+esc(x.comment)+'</p>':'')+'</div>'}).join('')||'<p class="mut">No feedback yet.</p>');
return h}
function fbl(){return FB_URL.indexOf('http')==0?'<div class="card row sp"><div><b>Join our robotics team on Facebook</b><p class="mut">News, photos and updates</p></div><a href="'+FB_URL+'" target="_blank" rel="noopener" style="background:var(--g);color:#fff;padding:10px 14px;border-radius:12px;text-decoration:none">Open</a></div>':''}
function inp(id,ph,v,t){return '<p><input id="'+id+'" type="'+(t||'text')+'" placeholder="'+ph+'" value="'+esc(v||'')+'" style="width:100%"></p>'}
function me(){var on=ENDPOINT.indexOf('http')==0,h='<h1>Me</h1>';
if(S.auth){h+='<div class="card"><b>Signed in</b><p class="mut">'+esc(S.auth.nick)+' ('+esc(S.auth.email||'')+')</p><button class="ghost" data-a="sync">Sync now</button> <button class="ghost" data-a="out">Sign out</button>'+(S.auth.admin?' <button data-a="adm">Admin dashboard</button>':'')+' <span id="sm" class="mut"></span></div><div class="card"><b>Tell us what you think</b><p class="mut">Overall, how is the app working? (1 = needs work, 5 = great)</p><div class="row" id="rt5" style="margin:10px 0">'+sc('o')+'</div><p class="mut">How easy is the app to use? (1 = hard, 5 = very easy)</p><div class="row" id="rt5e" style="margin:10px 0">'+sc('e')+'</div><p class="mut">Which feature do you like most?</p><p><select id="fav" style="width:100%"><option value="">Choose one</option>'+FEAT.map(function(f){return '<option>'+f+'</option>'}).join('')+'</select></p><p class="mut">Would you recommend this app to others?</p><div class="row" id="recs" style="margin:10px 0">'+['Yes','Maybe','No'].map(function(r){return '<button class="ghost" data-a="rec" data-id="'+r+'">'+r+'</button>'}).join('')+'</div><p class="mut">What improvements would you like to see?</p><textarea id="imp" rows="3" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--card);color:var(--ink)"></textarea><p class="mut">Anything else you would like to tell us?</p><textarea id="fbt" rows="2" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--card);color:var(--ink)"></textarea><p><button data-a="fb">Send feedback</button> <span id="fbm" class="mut"></span></p></div><p class="mut">Sync: '+(on?'connected':'not connected yet')+'. Waiting to upload: '+S.q.length+'.</p>'+fbl();return h}
h+='<p class="mut">Welcome to Mission Green! Please sign in to start. New here? Get a login code first.</p>';
h+='<div class="card"><b>1. Get a login code</b><p class="mut">Parents: enter your email and we will send a code. Please use a nickname for your child, not a real name.</p>'+inp('em','Parent email','','email')+inp('nk','Nickname','')+inp('fm','Group code (optional)',S.fam)+'<label style="display:flex;gap:10px;align-items:flex-start;margin:10px 0"><input type="checkbox" id="cons" style="width:22px;height:22px;flex:none"><span class="mut">I am the parent and I agree to share habit activity and feedback with the Mission Green team. My email is used only to send login codes. No real names, locations or phone numbers are collected.</span></label><button data-a="req">Email me a login code</button><p id="m1" class="mut"></p></div>';
h+='<div class="card"><b>2. Sign in</b>'+inp('em2','Parent email','','email')+'<p><input id="cd" placeholder="Login code" autocapitalize="characters" style="width:100%;text-transform:uppercase"></p><button data-a="login">Sign in</button><p id="m2" class="mut"></p></div>';
return h+fbl()}
function show(){if(!S.auth)tab='me';if(tab=='admin'&&!(S.auth&&S.auth.admin))tab='home';var V={home:home,habits:habits,chal:chal,rew:rew,impact:impact,me:me,admin:adminView};document.getElementById('v').innerHTML=V[tab]();
var T=[['home','🏠','Home'],['habits','✅','Habits'],['chal','🎯','Challenges'],['rew','🏆','Rewards'],['impact','🌍','Impact'],['me','👤','Me']];if(!S.auth)T=T.filter(function(t){return t[0]=='me'});
document.getElementById('n').innerHTML=T.map(function(t){return '<button data-a="tab" data-id="'+t[0]+'" class="'+(tab==t[0]?'on':'')+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
function demo(){S.logs={};S.goal=24;var A=HAB.map(function(h){return h.id});for(var i=0;i<12;i++){var n=i%2?2:3,a=[];for(var j=0;j<n;j++)a.push(A[(i+j)%A.length]);S.logs[fmt(ad(new Date(),-i))]=a}save();show()}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(a=='tab'){tab=id;show();window.scrollTo(0,0)}else if(a=='tg')chg(id,1);else if(a=='dec')chg(id,-1);else if(a=='demo')demo();else if(a=='clear'){S.logs={};S.goal=20;S.joined=[];S.custom=[];save();show()}
else if(a=='join'){var i=S.joined.indexOf(id);if(i<0)S.joined.push(id);else S.joined.splice(i,1);ev({type:'challenge',habit:id,action:i<0?'join':'leave'});chkCh();save();show()}
else if(a=='add'){var v=document.getElementById('nh').value.trim();if(v){var cid='c'+Date.now();S.custom.push({id:cid,n:v,i:'🌿',co2:0,w:0,e:0,x:0,m:0});ev({type:'custom',habit:cid,comment:v});save();show()}}
else if(a=='rem'){S.rem.on=!S.rem.on;if(S.rem.on){try{Notification.requestPermission()}catch(x){}}save();show()}});
document.addEventListener('change',function(e){if(e.target.id=='gs'){S.goal=+e.target.value;save();show()}if(e.target.id=='rt'){S.rem.time=e.target.value;save()}});
setInterval(function(){try{if(!S.rem.on)return;var d=new Date(),hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);if(hm==S.rem.time&&S.last!=td()){S.last=td();save();if(Notification.permission=='granted')new Notification('Mission Green',{body:'Choose reusable over single-use. Small choices, big change!'});else alert('Mission Green reminder: Choose reusable over single-use!')}}catch(x){}},20000);
function val(id){var x=document.getElementById(id);return x?x.value.trim():''}
function say(id,t){var x=document.getElementById(id);if(x)x.textContent=t}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
if(a=='rate'){var g=b.dataset.g,v=+b.dataset.id;if(g=='e')ease=v;else rate=v;var q=document.querySelectorAll(g=='e'?'#rt5e .chk':'#rt5 .chk');for(var i=0;i<q.length;i++)q[i].classList.toggle('on',i<v)}
else if(a=='rec'){recm=b.dataset.id;var q=document.querySelectorAll('#recs button');for(var i=0;i<q.length;i++)q[i].classList.toggle('sel',q[i].dataset.id==recm)}
else if(a=='req'){var em=val('em').toLowerCase(),nk=val('nk').slice(0,30),fm=val('fm').slice(0,10);
if(ENDPOINT.indexOf('http')!=0){say('m1','Sign-in is not set up yet.');return}
if(em.indexOf('@')<1||!nk){say('m1','Please enter a valid email and a nickname.');return}
if(!document.getElementById('cons').checked){say('m1','Please tick the parent agreement.');return}
S.fam=fm;save();say('m1','Sending...');
post({a:'request',email:em,nick:nk,fam:fm,consent:true},function(r){if(r&&r.ok){say('m1','If that email is valid, a code is on its way. Check your inbox and spam folder.');var x=document.getElementById('em2');if(x)x.value=em}else say('m1',r&&r.busy?'We are busy. Please try again tomorrow.':'Something went wrong. Please check the email and try again.')})}
else if(a=='login'){var em=val('em2').toLowerCase(),cd=val('cd');if(!em||!cd){say('m2','Enter your email and code.');return}say('m2','Signing in...');
post({a:'login',email:em,code:cd},function(r){if(r&&r.ok){S.auth={uid:r.uid,token:r.token,nick:r.nick,email:em,admin:!!r.admin};S.fam=r.fam||S.fam;tab='home';save();show();flush();pull(true);window.scrollTo(0,0)}else say('m2',r&&r.locked?'Too many tries. Please wait 15 minutes.':'That did not work. Check the code, or request a new one.')})}
else if(a=='adm'){tab='admin';ADM=null;show();loadAdmin();window.scrollTo(0,0)}
else if(a=='admback'){tab='me';show()}
else if(a=='sync')pull(true);
else if(a=='out'){S.auth=null;S.q=[];tab='me';save();show()}
else if(a=='fb'){if(!S.auth)return;var fav=val('fav');if(!rate||!ease||!recm||!fav){say('fbm','Please answer the rating, ease of use, favorite feature and recommend questions.');return}ev({type:'feedback',rating:rate,ease:ease,fav:fav,rec:recm,improve:document.getElementById('imp').value.slice(0,500),comment:document.getElementById('fbt').value.slice(0,500)});rate=0;ease=0;recm='';show();say('fbm','Thank you!')}});
window.addEventListener('online',flush);setInterval(flush,60000);flush();pull();document.addEventListener('visibilitychange',function(){if(!document.hidden){flush();pull()}});
show();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
